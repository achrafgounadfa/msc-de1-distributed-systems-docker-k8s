services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      image: achraf2026/msc-de1-flask-app:1.0.1
    container_name: flask-compose-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_RUN_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped

    # --- Sécurité : privilèges réduits ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"

    # --- Sécurité : système de fichiers en lecture seule ---
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s