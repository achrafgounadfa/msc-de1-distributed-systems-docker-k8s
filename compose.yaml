services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-sample-app:v1.0
    container_name: flask-compose-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_RUN_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s